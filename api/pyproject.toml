[project]
name = "markitdown-api"
version = "0.1.0"
description = "FastAPI backend for MarkItDown document converter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "markitdown[pdf,docx,pptx,xlsx,az-doc-intel]>=0.1.6",
    "markitdown-ocr>=0.1.0",
    "openai>=1.0",
    "pymupdf4llm>=0.0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["markitdown_api"]
