name: Windows app

# Builds the native WPF app into a standalone OcrReview.exe on a Windows runner
# and uploads it as a downloadable artifact. This is the verified path to the .exe
# (the app can't be compiled on macOS/Linux — WPF + WinRT are Windows-only targets).

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OcrReview.sln

      - name: Test (Core)
        run: dotnet test tests/OcrReview.Core.Tests/OcrReview.Core.Tests.csproj -c Release --no-restore

      # Primary artifact: ONE self-contained OcrReview.exe with everything embedded.
      # It survives being copied/moved/mailed on its own — there is no folder of DLLs
      # to lose, and no .NET install is needed.
      - name: Publish portable single-file exe
        run: >
          dotnet publish src/OcrReview.App/OcrReview.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish-single

      # Fallback artifact: self-contained FOLDER publish — zero self-extraction at
      # launch, the most conservative form for WPF + WinRT. Run OcrReview.exe from
      # inside the folder.
      - name: Publish self-contained app folder
        run: >
          dotnet publish src/OcrReview.App/OcrReview.App.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Smoke-check artifacts
        shell: pwsh
        run: |
          if (!(Test-Path publish-single/OcrReview.exe)) { throw "single-file exe missing" }
          if (!(Test-Path publish/OcrReview.exe)) { throw "folder exe missing" }
          "single-file exe: {0:N1} MB" -f ((Get-Item publish-single/OcrReview.exe).Length / 1MB)

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: OcrReview-win-x64-portable
          path: windows/publish-single/OcrReview.exe
          if-no-files-found: error

      - name: Upload app folder
        uses: actions/upload-artifact@v7
        with:
          name: OcrReview-win-x64
          path: windows/publish
          if-no-files-found: error
