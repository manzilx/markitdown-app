name: Windows app

# Builds the native WPF app into a standalone OcrReview.exe on a Windows runner
# and uploads it as a downloadable artifact. This is the verified path to the .exe
# (the app can't be compiled on macOS/Linux — WPF + WinRT are Windows-only targets).

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OcrReview.sln

      - name: Test (Core)
        run: dotnet test tests/OcrReview.Core.Tests/OcrReview.Core.Tests.csproj -c Release --no-restore

      # Self-contained FOLDER publish (not single-file): the most reliable form for
      # WPF + WinRT — avoids single-file self-extraction failures at launch.
      # Run OcrReview.exe from inside the extracted folder; no .NET install needed.
      - name: Publish self-contained app
        run: >
          dotnet publish src/OcrReview.App/OcrReview.App.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Upload app folder
        uses: actions/upload-artifact@v7
        with:
          name: OcrReview-win-x64
          path: windows/publish
          if-no-files-found: error
